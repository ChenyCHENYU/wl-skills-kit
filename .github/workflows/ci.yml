name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
      - name: Verify canonical single-repository distribution
        run: node kit-internal/conformance/scripts/sync-support.cjs --packages kit --check
      - name: Verify distribution guards without sibling checkouts
        run: node --test kit-internal/conformance/test/distribution-integrity.check.cjs kit-internal/conformance/test/sync-support.check.cjs kit-internal/conformance/test/composition-checkouts.check.cjs kit-internal/conformance/test/release-artifact.check.cjs
      - name: Verify host evaluation grading and mock boundaries without a model
        run: node --test kit-internal/conformance/test/host-skill-runner.check.cjs kit-internal/conformance/test/host-skill-cases.check.cjs
      - run: npm run support:check
      - run: npm run support:pack-check
      - run: pnpm verify
      - run: npm pack --dry-run --ignore-scripts

  compatibility:
    name: Published baseline upgrade and coexistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run compatibility:check -- --output compatibility-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-evidence
          path: compatibility-evidence
